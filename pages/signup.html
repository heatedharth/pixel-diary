<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Pixel Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Just+Me+Again+Down+Here&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
</head>

<body class="auth-page">

    <!-- ── Supabase SDK ── -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ── Your scripts ── -->
    <script src="../supabase.config.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/auth.js"></script>

    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🌸</span>
            <h1>Create Account</h1>
            <p>Start your Pixel Diary today!</p>
        </div>

        <div class="auth-message" id="auth-message"></div>

        <form class="auth-form" id="signup-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="your gamer tag" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="at least 6 characters" required minlength="6" />
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <div class="auth-divider">or</div>

        <p class="auth-switch">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </div>

    <script src="../assets/js/signup.js"></script>
    <script src="../assets/js/cursor-trail.js"></script>

</body>

</html>
